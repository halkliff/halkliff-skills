interface:
  display_name: "Review work"
  short_description: "Review requirements, verify findings, report readiness"
  default_prompt: "Use $review-work once to assess this implementation and its relevant effects against the approved requirements. Offer the review defaults for roles I leave unspecified. Create useful coordinator chats using gpt-6.2-astra at High by default, with my scoped choices taking precedence. Coordinate scoped messages among them under this request. Preserve my checkout and data, keep reviewer code writes in reviewer-owned clones or worktrees, and return the offline report and work-chat handoff without repairs. Recover existing context and confirm any missing material setup. Create a goal only if I explicitly request one."
policy:
  allow_implicit_invocation: false
