interface:
  display_name: "Orchestrate work"
  short_description: "Coordinate parallel work with selected model routes"
  default_prompt: "Use $orchestrate-work for this outcome. Settle any missing model and effort choices for the main chat, coordinators and workers in one setup question, recommending economical defaults. Create and coordinate separate task chats for substantial parallel work with my confirmed coordinator model and effort (GPT-6.2 Sol High is the recommended default). Use subagents alone for light work. Let main-chat workers and coordinators exchange findings and clarifications directly, keeping decisions and uncertainty with their parents. Confirm goal-backed execution (recommended, using $define-goal) or goal-free execution, my understood outcome and the verification process before activation or implementation."
policy:
  allow_implicit_invocation: false
