interface:
  display_name: "Orchestrate work"
  short_description: "Choose the orchestrator; Sol 6.1 verifies, Luna executes"
  default_prompt: "Use $orchestrate-work for this outcome with my selected orchestrator. Create and coordinate GPT-6.1 Sol task threads as needed for substantial parallel work; use subagents alone for light work. Allow main-thread workers and Sol task threads to exchange findings and clarifications directly, keeping decisions and uncertainty with their parents. Confirm goal-backed execution (recommended, using $define-goal) or goal-free execution, and my understood outcome and verification process before activation or implementation. Follow the workflow setup and acceptance rules."
policy:
  allow_implicit_invocation: false
